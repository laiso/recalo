name: Android Delivery

on:
  push:
    branches: [ "main" ]
    tags: [ "v*" ]

permissions:
  contents: write

jobs:
  quality-gate:
    name: Quality gate
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android platform
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Grant execute permission for gradlew
        run: chmod +x apps/android/gradlew

      - name: Run unit tests
        run: ./gradlew testDevDebugUnitTest
        working-directory: apps/android

  build-apk:
    name: Build APK
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: quality-gate

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android platform
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Grant execute permission for gradlew
        run: chmod +x apps/android/gradlew

      - name: Build debug and release APKs
        run: ./gradlew assembleDebug assembleRelease
        working-directory: apps/android

      - name: Upload APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: android-apks-${{ github.run_number }}
          path: apps/android/app/build/outputs/apk/**/*.apk
          if-no-files-found: error
          retention-days: 14

  github-release:
    name: GitHub Release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: build-apk
    if: startsWith(github.ref, 'refs/tags/v')

    steps:
      - name: Download APK artifacts
        uses: actions/download-artifact@v4
        with:
          name: android-apks-${{ github.run_number }}
          path: release-apks

      - name: Create GitHub Release and upload APKs
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ github.ref_name }}
        run: |
          mapfile -t apks < <(find release-apks -type f -name '*.apk' | sort)
          if [ "${#apks[@]}" -eq 0 ]; then
            echo "No APK files found for release upload." >&2
            exit 1
          fi

          if gh release view "$TAG_NAME" >/dev/null 2>&1; then
            gh release upload "$TAG_NAME" "${apks[@]}" --clobber
          else
            gh release create "$TAG_NAME" "${apks[@]}" --title "$TAG_NAME" --generate-notes
          fi
